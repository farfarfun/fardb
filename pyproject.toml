[project]
name = "fardb"
version = "1.4.4"
description = "基于 SQLAlchemy 的轻量数据库工具库：引擎创建与复用、通用表基类、增删改查与 upsert，附带 extendsclass JSON Storage 客户端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "farlog>=1.1.7", "farcache>=2.0.3", "sqlalchemy>=2.0.36", "pandas>=2.0.0", "requests>=2.28.0",]
optional-dependencies = { mysql = ["pymysql>=1.1.0"] }
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fardb"
Releases = "https://github.com/farfarfun/fardb/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fardb"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["I"]

[dependency-groups]
dev = [ "pytest>=8.0.0", "ruff>=0.6.0",]
