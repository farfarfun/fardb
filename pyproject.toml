[project]
name = "fundb-tau"
version = "1.3.20"
description = "funddb"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "farlog>=1.1.7", "funutil>=1.0.19", "sqlalchemy>=2.0.36", "pandas>=2.0.0", "requests>=2.28.0", "cachebox>=3.0.0", "diskcache>=5.6.0",]
license = "MIT"
license-files = ["LICENSE"]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fundb-tau"
Releases = "https://github.com/farfarfun/fundb-tau/releases"
[tool.setuptools]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundb"]

[dependency-groups]
dev = [ "pytest>=8.0.0",]
